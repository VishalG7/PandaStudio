<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- App Squircle Frame -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.75"/>

  <!-- Panda Ears -->
  <circle cx="26" cy="27" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="26" cy="27" r="7" fill="#334155"/>
  <circle cx="74" cy="27" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="74" cy="27" r="7" fill="#334155"/>

  <!-- Panda Face -->
  <ellipse cx="50" cy="54" rx="34" ry="30" fill="#ffffff"/>

  <!-- Eye Patches -->
  <ellipse cx="37" cy="51" rx="9.5" ry="11.5" fill="#0f172a" transform="rotate(-18 37 51)"/>
  <ellipse cx="63" cy="51" rx="9.5" ry="11.5" fill="#0f172a" transform="rotate(18 63 51)"/>

  <!-- Big Sparkly Eyes -->
  <circle cx="38" cy="49" r="4" fill="#ffffff"/>
  <circle cx="40" cy="52" r="1.8" fill="#38bdf8"/>
  <circle cx="62" cy="49" r="4" fill="#ffffff"/>
  <circle cx="60" cy="52" r="1.8" fill="#38bdf8"/>

  <!-- Nose -->
  <ellipse cx="50" cy="62" rx="5.5" ry="3.5" fill="#0f172a"/>

  <!-- Smiling Mouth -->
  <path d="M 43 67 Q 50 73 57 67" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cute Rosy Cheeks -->
  <circle cx="27" cy="60" r="4.5" fill="#fb7185" opacity="0.45"/>
  <circle cx="73" cy="60" r="4.5" fill="#fb7185" opacity="0.45"/>

  <!-- Studio Play Badge (Top-Right) -->
  <circle cx="82" cy="18" r="11" fill="url(#playGrad)" stroke="#ffffff" stroke-width="1.8"/>
  <polygon points="79,13 79,23 88,18" fill="#ffffff"/>
</svg>
